name: CI

on:
  # 2724f7d0 (AC-4): release/** is listed alongside main because the v2.x beta
  # line is developed on release/v2.1-beta, which no CI run had ever observed --
  # every run on record carried headBranch: main. main stays first and unchanged.
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # e9fa6331: must equal extension/package.json engines.node verbatim --
          # enforced across every workflow by tests/engines-node-pin.test.js.
          # Supersedes the prior '24' pin, whose stated grounds no longer hold:
          # no Node 25 target is documented in either CLAUDE.md, and the
          # 'Promise resolution is still pending' symptom it cited measures 0
          # occurrences on ubuntu-latest at v22.23.2 (release run 32689967189).
          node-version: '22.x'

      - name: Enable corepack (pnpm/yarn on PATH)
        # R-CIFB residual: convergence-gate fixtures carrying a pnpm-workspace
        # marker make detectProjectType=pnpm; corepack puts pnpm on PATH so the
        # gate's detectMissingTools(['pnpm']) does not short-circuit red on Linux CI.
        run: corepack enable

      - name: Install ripgrep
        # A3/B-CIGREEN ROOT A: audit-trap-door-enforcement.sh shells out to `rg`.
        # ubuntu-latest does not ship it, so without this step the audit's
        # isUnrunnableCheckResult fail-closed path (2bf16f30) trips on every run.
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install and test
        # R-CIFB: point getExtensionRoot() at the checked-out repo (sentinel
        # extension/bin/log-watcher.js is committed) instead of the deployed
        # ~/.claude/pickle-rick, which CI never creates (no install.sh).
        env:
          EXTENSION_DIR: ${{ github.workspace }}
        run: cd extension && npm ci && npx tsc --noEmit && npx eslint src/ --max-warnings=-1 && npx tsc && bash scripts/audit-test-tiers.sh && bash scripts/audit-test-isolation.sh && bash scripts/audit-subprocess-heavy-tests.sh && bash scripts/audit-fix-commits.sh && bash scripts/audit-bundle-thesis.sh && bash scripts/audit-quarantine.sh && bash scripts/audit-trap-door-enforcement.sh && bash scripts/audit-guarded-reset.sh && bash scripts/audit-un-terminalize-single-path.sh && bash scripts/audit-did-we-count.sh && npm run test:fast:budget && npm run test:integration && RUN_EXPENSIVE_TESTS=1 npm run test:expensive
