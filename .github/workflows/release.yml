name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        # Runs before setup-node: ubuntu-latest ships a system Node.js in the
        # base image tooling, so `node -p` works here without waiting for
        # setup-node, letting this guard fail BEFORE the ~20-minute
        # install/compile step runs on a tree that is already provably wrong.
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$(node -p "require('./extension/package.json').version")"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag version '${EXPECTED}' does not match extension/package.json version '${ACTUAL}'" >&2
            exit 1
          fi
          echo "Tag version '${EXPECTED}' matches extension/package.json version '${ACTUAL}'"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Enable corepack (pnpm/yarn on PATH)
        # 139925d8: deliberate mirror of ci.yml — do not delete as redundant. Both
        # workflows run the SAME command string, but only ci.yml provisioned the
        # environment it needs, so release.yml alone went red. convergence-gate
        # fixtures carry a pnpm-workspace marker, making detectProjectType=pnpm;
        # without pnpm on PATH the gate's detectMissingTools(['pnpm'])
        # (convergence-gate.ts:739) short-circuits red on Linux CI.
        run: corepack enable

      - name: Install and compile
        # 139925d8: deliberate mirror of ci.yml — do not delete as redundant.
        # Points getExtensionRoot() (pickle-utils.ts:371) at the checked-out repo
        # via the committed sentinel extension/bin/log-watcher.js. Unset, it falls
        # back to CANONICAL_EXTENSION_ROOT ~/.claude/pickle-rick, which CI never
        # creates (no install.sh) — reddening every suite that reads a deployed artifact.
        env:
          EXTENSION_DIR: ${{ github.workspace }}
        run: cd extension && npm ci && npx tsc --noEmit && npx eslint src/ --max-warnings=-1 && npx tsc && bash scripts/audit-test-tiers.sh && bash scripts/audit-test-isolation.sh && bash scripts/audit-subprocess-heavy-tests.sh && bash scripts/audit-fix-commits.sh && bash scripts/audit-bundle-thesis.sh && bash scripts/audit-quarantine.sh && bash scripts/audit-trap-door-enforcement.sh && bash scripts/audit-guarded-reset.sh && bash scripts/audit-un-terminalize-single-path.sh && bash scripts/audit-did-we-count.sh && npm run test:fast:budget && npm run test:integration && RUN_EXPENSIVE_TESTS=1 npm run test:expensive

      - name: Build tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "pickle-rick-${VERSION}.tar.gz" \
            extension/bin/ \
            extension/services/ \
            extension/types/ \
            extension/hooks/ \
            extension/scripts/ \
            extension/layouts/ \
            extension/eslint-plugin-pickle/ \
            extension/package.json \
            install.sh \
            .claude/commands/ \
            pickle_settings.json \
            persona.md
          echo "TARBALL=pickle-rick-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.TARBALL }}
